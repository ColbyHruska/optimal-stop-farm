<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimal Stopping Farm Simulation</title>
    <meta name="description"
        content="An interactive exploration of Optimal Stopping Theory using a Minecraft-style crop farm simulation. Compare harvest strategies in real time.">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Optimal Farm</h1>
            <p>An exploration of Optimal Stopping Theory using Minecraft-style crops.</p>
        </header>

        <main class="dashboard">

            <!-- Enemy / Left Farm (hidden by default) -->
            <section class="farm-section enemy-section hidden" id="enemy-section">
                <h2 class="farm-title" id="enemy-farm-title">Farm 1 (Left)</h2>
                <div class="farm-content">
                    <div id="enemy-farm-grid" class="farm-grid"></div>
                    <div class="stat-section comp-inline-stats">
                        <div class="stat-box stat-column">
                            <span class="stat-label stat-label--inline">Total Yield</span>
                            <span id="stat-yield-enemy" class="stat-value stat-value--large">0</span>
                        </div>
                        <div class="stat-box stat-column highlight stat-divider-top">
                            <span class="stat-label stat-label--subtle">Yield / Time</span>
                            <span id="stat-yield-time-enemy" class="stat-value">0.0000</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Player / Right Farm -->
            <section class="farm-section player-section">
                <h2 class="farm-title hidden" id="player-farm-title">Farm 2 (Right)</h2>
                <div class="farm-content">
                    <div class="farm-column">
                        <div id="farm-grid" class="farm-grid"></div>
                        <button id="btn-harvest" class="btn harvest-btn harvest-btn--full hidden">Harvest Now</button>
                    </div>
                    <div class="stat-section comp-inline-stats hidden" id="player-inline-stats">
                        <div class="stat-box stat-column">
                            <span class="stat-label stat-label--inline">Total Yield</span>
                            <span id="stat-yield-player" class="stat-value stat-value--large">0</span>
                        </div>
                        <div class="stat-box stat-column highlight stat-divider-top">
                            <span class="stat-label stat-label--subtle">Yield / Time</span>
                            <span id="stat-yield-time-player" class="stat-value">0.0000</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Controls & Stats Panel -->
            <section class="control-section">

                <div class="panel stats-panel" id="standard-stats">
                    <h2>Statistics</h2>
                    <div class="stat-box">
                        <span class="stat-label">Total Yield:</span>
                        <span id="stat-yield" class="stat-value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Total Time (Ticks):</span>
                        <span id="stat-ticks" class="stat-value">0</span>
                    </div>
                    <div class="stat-box highlight">
                        <span class="stat-label">Yield / Time:</span>
                        <span id="stat-yield-time" class="stat-value">0.0000</span>
                    </div>
                </div>

                <div class="panel controls-panel">
                    <h2>Simulation Controls</h2>

                    <div class="control-group">
                        <label for="strategy-select" id="right-strategy-label">Farm Strategy:</label>
                        <select id="strategy-select">
                            <option value="manual">Manual</option>
                            <option value="threshold">Threshold</option>
                            <option value="naive_heuristic">Crude Expected Value</option>
                            <option value="smart_heuristic">Smarter Expected Value</option>
                            <option value="fixed_time_lookahead">Fixed-Time Lookahead</option>
                        </select>
                    </div>

                    <div class="control-group hidden" id="player-threshold-group">
                        <label for="player-threshold">Harvest at: <span id="player-threshold-label">100</span>%</label>
                        <input type="range" id="player-threshold" min="1" max="100" value="100">
                    </div>

                    <div class="control-group" id="compete-group">
                        <label>
                            <input type="checkbox" id="compete-toggle"> Enable Dual Farm Display
                        </label>
                        <label id="left-strategy-label" for="enemy-strategy" class="hidden label--spaced">Left Farm
                            Strategy:</label>
                        <select id="enemy-strategy" class="hidden">
                            <option value="threshold">Threshold</option>
                            <option value="naive_heuristic">Crude Expected Value</option>
                            <option value="smart_heuristic">Smarter Expected Value</option>
                            <option value="fixed_time_lookahead">Fixed-Time Lookahead</option>
                        </select>
                        <div id="enemy-threshold-group" class="hidden threshold-sub-group">
                            <label for="enemy-threshold">Harvest at: <span
                                    id="enemy-threshold-label">100</span>%</label>
                            <input type="range" id="enemy-threshold" min="1" max="100" value="100">
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="speed-slider">Tick Speed: <span id="speed-label">Medium</span></label>
                        <input type="range" id="speed-slider" min="1" max="100" value="50">
                    </div>

                    <div class="button-group">
                        <button id="btn-play-pause" class="btn primary-btn">Play</button>
                        <button id="btn-step" class="btn secondary-btn">Step</button>
                        <button id="btn-reset" class="btn danger-btn">Reset</button>
                    </div>
                </div>
            </section>

            <!-- Performance Chart -->
            <section class="chart-section" id="chart-section">
                <div class="panel chart-panel">
                    <h2>Performance History</h2>
                    <canvas id="chart-canvas"></canvas>
                </div>
            </section>

        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
