<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimal Stopping Farm Simulation</title>
    <meta name="description"
        content="An interactive exploration of Optimal Stopping Theory using a Minecraft-style crop farm simulation. Compare harvest strategies in real time.">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Optimal Farm</h1>
            <p>An exploration of Optimal Stopping Theory using Minecraft-style crops.</p>
        </header>

        <main class="dashboard">

            <!-- Farm cards are dynamically inserted here -->
            <div id="farms-container" class="farms-container"></div>

            <!-- Controls Panel -->
            <section class="control-section" id="control-section">
                <div class="panel controls-panel">
                    <h2>Simulation Controls</h2>

                    <div class="control-group farm-count-group">
                        <label>Farms: <span id="farm-count-label">1</span></label>
                        <div class="button-group">
                            <button id="btn-add-farm" class="btn secondary-btn">+ Add Farm</button>
                            <button id="btn-remove-farm" class="btn secondary-btn">− Remove Farm</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="grid-size-input">Grid Size: <span id="grid-size-label">9</span>×<span
                                id="grid-size-label2">9</span></label>
                        <input type="range" id="grid-size-input" min="3" max="15" value="9">
                    </div>

                    <div class="control-group">
                        <label>Global Stats</label>
                        <div class="stat-box">
                            <span class="stat-label">Total Time (Ticks):</span>
                            <span id="stat-ticks" class="stat-value">0</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="speed-slider">Tick Speed: <span id="speed-label">Medium</span></label>
                        <input type="range" id="speed-slider" min="1" max="100" value="50">
                    </div>

                    <div class="button-group">
                        <button id="btn-play-pause" class="btn primary-btn">Play</button>
                        <button id="btn-step" class="btn secondary-btn">Step</button>
                        <button id="btn-reset" class="btn danger-btn">Reset</button>
                    </div>
                </div>
            </section>

            <!-- Performance Chart -->
            <section class="chart-section" id="chart-section">
                <div class="panel chart-panel">
                    <h2>Performance History</h2>
                    <canvas id="chart-canvas"></canvas>
                </div>
            </section>

        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
